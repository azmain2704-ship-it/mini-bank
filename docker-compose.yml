# docker compose up --build   ->  API on http://localhost:8080, Swagger UI on http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d minibank"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/minibank
      DB_USER: minibank
      DB_PASSWORD: minibank
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
