name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  docker:
    name: Docker + PostgreSQL smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the app and database
        run: docker compose up -d --build
      - name: Smoke test
        run: bash scripts/smoke-test.sh
      - name: Show logs if it failed
        if: failure()
        run: docker compose logs app
      - name: Stop
        if: always()
        run: docker compose down -v
