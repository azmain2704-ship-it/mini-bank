# Run on your own machine with no database to install:  mvnw spring-boot:run -Dspring-boot.run.profiles=local
# Uses an H2 database saved in ./data so accounts survive a restart.
spring:
  datasource:
    url: jdbc:h2:file:./data/minibank;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
